<!doctype html><html lang='th'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#2563eb'><link rel='manifest' href='manifest.webmanifest'><link rel='icon' href='icon.svg'><title>หารบิล</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans Thai',sans-serif;color:#182033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;padding:18px 16px 110px}.top{display:flex;align-items:center;justify-content:space-between}.logo{font-size:26px;font-weight:800}.badge{background:#eaf2ff;color:#1769e0;padding:7px 10px;border-radius:999px;font-weight:700}.card{border:1px solid #e5eaf2;border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 4px 18px #1d4ed808}.title{font-weight:800;font-size:18px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row input,.row select{min-width:0;flex:1;border:1px solid #dce3ed;border-radius:12px;padding:12px;font-size:16px}.price{max-width:115px}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:750;font-size:15px;cursor:pointer}.primary{background:#2563eb;color:#fff}.soft{background:#eef4ff;color:#185dcc}.danger{background:#fff0f0;color:#d53030;padding:10px}.people{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #dce3ed;border-radius:999px;padding:8px 11px;background:#fff}.chip.on{background:#eaf2ff;border-color:#7aaaff;color:#185dcc}.item{border-top:1px dashed #d9dfe8;padding-top:10px;margin-top:10px}.who{font-size:13px;color:#667085;margin-top:4px}.summary{background:#f7faff}.sumrow{display:flex;justify-content:space-between;padding:7px 0}.personTotal{display:flex;justify-content:space-between;background:#fff;border-radius:14px;padding:13px;margin-top:8px;border:1px solid #e4e9f0}.personTotal b{color:#1677ef;font-size:20px}.footer{position:fixed;left:0;right:0;bottom:0;background:#ffffffee;backdrop-filter:blur(12px);border-top:1px solid #e8edf4;padding:12px}.footerin{max-width:588px;margin:auto;display:flex;gap:8px}.footer .btn{flex:1}.small{font-size:13px;color:#697386}.empty{text-align:center;color:#8b95a5;padding:16px}h1{margin:8px 0 0}.receipt{font-family:ui-monospace,Consolas,monospace}.receipt .personTotal{font-family:system-ui,-apple-system,'Noto Sans Thai',sans-serif}@media(display-mode:standalone){.app{padding-top:max(18px,env(safe-area-inset-top))}}
</style></head><body><main class='app'><div class='top'><div><div class='badge'>BILL SPLIT</div><h1>หารบิล</h1><div class='small'>คิดให้ว่าใครต้องจ่ายเท่าไร</div></div><button class='btn soft' id='install' hidden>ติดตั้งแอป</button></div>
<section class='card'><div class='title'>👥 คนในบิล</div><div id='people'></div><div class='row'><input id='newPerson' placeholder='ชื่อ เช่น บีม'><button class='btn primary' onclick='addPerson()'>+ เพิ่มคน</button></div></section>
<section class='card'><div class='title'>🧾 รายการ</div><div id='items'></div><button class='btn soft' style='width:100%;margin-top:10px' onclick='addItem()'>+ เพิ่มรายการ</button></section>
<section class='card'><div class='title'>➕ ค่าใช้จ่ายเพิ่มเติม</div><div class='row'><input id='service' type='number' min='0' step='.01' placeholder='ค่าบริการ'><input id='discount' type='number' min='0' step='.01' placeholder='ส่วนลด'></div><div class='small'>ค่าบริการและส่วนลดจะกระจายตามสัดส่วนยอดของแต่ละคน</div></section>
<section class='card summary receipt'><div class='title'>สรุปบิล</div><div class='sumrow'><span>รวมรายการ</span><b id='subtotal'>฿0.00</b></div><div class='sumrow'><span>ยอดสุทธิ</span><b id='grand'>฿0.00</b></div><hr style='border:0;border-top:1px dashed #bbc3ce'><div id='totals'></div></section>
</main><div class='footer'><div class='footerin'><button class='btn soft' onclick='resetBill()'>บิลใหม่</button><button class='btn primary' onclick='shareSummary()'>แชร์สรุปบิล</button></div></div>
<script>
let state=JSON.parse(localStorage.getItem('billsplit-state')||'null')||{people:[{id:1,name:'คนที่ 1'},{id:2,name:'คนที่ 2'}],items:[{id:1,name:'',price:'',people:[1,2]}]};let seq=Date.now();
const money=n=>'฿'+(Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});const save=()=>{localStorage.setItem('billsplit-state',JSON.stringify(state));render()};
function addPerson(){let el=document.getElementById('newPerson'),name=el.value.trim()||`คนที่ ${state.people.length+1}`;state.people.push({id:++seq,name});el.value='';save()}
function delPerson(id){if(state.people.length<=1)return alert('ต้องมีอย่างน้อย 1 คน');state.people=state.people.filter(p=>p.id!==id);state.items.forEach(x=>x.people=x.people.filter(v=>v!==id));save()}
function addItem(){state.items.push({id:++seq,name:'',price:'',people:state.people.map(p=>p.id)});save()}
function delItem(id){state.items=state.items.filter(x=>x.id!==id);save()}
function updItem(id,k,v){let x=state.items.find(x=>x.id===id);x[k]=v;save()}
function toggle(id,pid){let x=state.items.find(x=>x.id===id);x.people=x.people.includes(pid)?x.people.filter(v=>v!==pid):[...x.people,pid];save()}
function rename(id,v){let p=state.people.find(p=>p.id===id);p.name=v||p.name;save()}
function calc(){let totals=Object.fromEntries(state.people.map(p=>[p.id,0])),sub=0;state.items.forEach(x=>{let pr=+x.price||0;sub+=pr;if(x.people.length)x.people.forEach(id=>totals[id]=(totals[id]||0)+pr/x.people.length)});let service=+document.getElementById('service')?.value||0,disc=+document.getElementById('discount')?.value||0,net=Math.max(0,sub+service-disc);if(sub>0)Object.keys(totals).forEach(id=>totals[id]=totals[id]/sub*net);return{sub,net,totals}}
function render(){let pe=document.getElementById('people');pe.innerHTML=state.people.map(p=>`<div class='row'><input value='${esc(p.name)}' onchange='rename(${p.id},this.value)'><button class='btn danger' onclick='delPerson(${p.id})'>ลบ</button></div>`).join('');let it=document.getElementById('items');it.innerHTML=state.items.length?state.items.map((x,i)=>`<div class='item'><div class='row'><input placeholder='รายการ เช่น ข้าวผัด' value='${esc(x.name)}' onchange='updItem(${x.id},"name",this.value)'><input class='price' type='number' min='0' step='.01' placeholder='ราคา' value='${esc(x.price)}' oninput='updItem(${x.id},"price",this.value)'><button class='btn danger' onclick='delItem(${x.id})'>×</button></div><div class='small'>ใครร่วมจ่ายรายการนี้</div><div class='people'>${state.people.map(p=>`<button class='chip ${x.people.includes(p.id)?'on':''}' onclick='toggle(${x.id},${p.id})'>${esc(p.name)}</button>`).join('')}</div></div>`).join(''):`<div class='empty'>ยังไม่มีรายการ</div>`;updateTotals()}
function updateTotals(){let {sub,net,totals}=calc();document.getElementById('subtotal').textContent=money(sub);document.getElementById('grand').textContent=money(net);document.getElementById('totals').innerHTML=state.people.map(p=>`<div class='personTotal'><span>${esc(p.name)}</span><b>${money(totals[p.id]||0)}</b></div>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
['service','discount'].forEach(id=>document.getElementById(id).addEventListener('input',updateTotals));function resetBill(){if(confirm('เริ่มบิลใหม่?')){state={people:[{id:++seq,name:'คนที่ 1'},{id:++seq,name:'คนที่ 2'}],items:[{id:++seq,name:'',price:'',people:[]}]};localStorage.removeItem('billsplit-state');document.getElementById('service').value='';document.getElementById('discount').value='';render()}}
async function shareSummary(){let c=calc(),lines=['🧾 สรุปหารบิล',''];state.items.filter(x=>+x.price).forEach(x=>lines.push(`${x.name||'รายการ'} ${money(x.price)}`));lines.push('',`รวม ${money(c.net)}`,'',...state.people.map(p=>`${p.name}: ${money(c.totals[p.id]||0)}`));let text=lines.join('\n');try{if(navigator.share)await navigator.share({title:'สรุปหารบิล',text});else{await navigator.clipboard.writeText(text);alert('คัดลอกสรุปบิลแล้ว')}}catch(e){}}
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.hidden=false});install.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;install.hidden=true}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
